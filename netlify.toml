# Netlify 的 Git 集成构建配置。
#
# 生产分支是 dev：dev 上游戏相关路径有变更时，Netlify 跑一次这里的 command，
# 然后把 publish 目录发成正式站 https://bwpg.netlify.app。
# Web 部署不经过 GitHub Actions；WPG CI 仍然只负责检查代码。
#
# netlify.toml 的设置优先级高于网页上的 Build settings，所以
# Project configuration → Continuous deployment → Build settings 里的
# Build command / Publish directory 留空就行，不要两边都填。

[build]
  command = "python3 tools/deploy/netlify_build.py"
  publish = "build/web/raw"
  # 跳过条件（exit 0 = 取消构建，exit 1 = 继续构建）：
  # 1) Deploy Preview 一律跳过（仍要几分钟下 Godot）。
  # 2) 若相对上一成功部署的 commit，下列「会进 Web 包 / 构建链」的路径
  #    没有任何差异，也跳过——避免纯 docs / README / roadmap 重复烧分钟。
  # $CACHED_COMMIT_REF 为空（首次部署）时强制构建，避免误跳过。
  ignore = """
    if [ "$CONTEXT" = "deploy-preview" ]; then exit 0; fi
    if [ -z "$CACHED_COMMIT_REF" ] || [ -z "$COMMIT_REF" ]; then exit 1; fi
    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- \
      project.godot \
      export_presets.cfg \
      netlify.toml \
      web_export.html \
      default_bus_layout.tres \
      ability \
      addons \
      android \
      arena \
      audio \
      camera \
      combat \
      companions \
      data \
      enemies \
      icons \
      images \
      lobby \
      locale \
      maps \
      player \
      sandbox \
      ui \
      weapons \
      tools/build \
      tools/ci/install_godot.py \
      tools/deploy \
      tools/wpg_common.py
  """

[build.environment]
  # 钉住 Python 大版本，免得 Netlify 换默认版本时构建行为漂移。
  PYTHON_VERSION = "3.12"
  # 日志实时出，不在管道里攒着。
  PYTHONUNBUFFERED = "1"

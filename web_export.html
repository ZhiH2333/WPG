<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: system-ui, sans-serif;
            z-index: 1000;
        }
        .loading.hidden {
            display: none;
        }
        .loading-bar {
            width: 80%;
            max-width: 400px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
        }
        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.1s ease-out;
        }
        .loading-error {
            color: #f00;
            text-align: center;
            padding: 16px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div>WPG</div>
        <div class="loading-bar">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script src="$GODOT_URL"></script>
    <script>
        // Request fullscreen on load (including mobile)
        function requestFullscreen() {
            const elem = document.documentElement;
            
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log('Fullscreen request failed:', err);
                });
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen().catch(err => {
                    console.log('Fullscreen request failed:', err);
                });
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen().catch(err => {
                    console.log('Fullscreen request failed:', err);
                });
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen().catch(err => {
                    console.log('Fullscreen request failed:', err);
                });
            }
        }

        function requestFullscreenOnInteraction() {
            document.addEventListener('click', requestFullscreen, { once: true });
            document.addEventListener('touchstart', requestFullscreen, { once: true });
            document.addEventListener('keydown', requestFullscreen, { once: true });
        }

        function tryAutoFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                return;
            }
            requestFullscreen();
            requestFullscreenOnInteraction();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryAutoFullscreen);
        } else {
            tryAutoFullscreen();
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                tryAutoFullscreen();
            }
        });

        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        const loadingBarFill = document.getElementById('loading-bar-fill');

        const engine = new Engine($GODOT_CONFIG);

        engine.startGame({
            canvas: canvas,
            onProgress: (current, total) => {
                if (loadingBarFill && current > 0 && total > 0) {
                    loadingBarFill.style.width = `${Math.round((current / total) * 100)}%`;
                }
            },
            onPrint: (message) => {
                console.log(message);
            },
            onPrintError: (message) => {
                console.error(message);
            }
        }).then(() => {
            if (loading) {
                loading.classList.add('hidden');
            }
            tryAutoFullscreen();
        }).catch((err) => {
            console.error('Engine start error:', err);
            if (loading) {
                loading.innerHTML = '<div class="loading-error">Failed to load game</div>';
            }
        });
    </script>
</body>
</html>

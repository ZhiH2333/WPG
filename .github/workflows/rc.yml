name: WPG RC Pre-release

run-name: >-
  WPG RC — ${{ inputs.version }} — ${{ inputs.sha }}

# 独立于正式 WPG Release（release.yml）。
# - 仅 workflow_dispatch；必须显式传入完整 SHA + RC 版本。
# - 不默认构建 main HEAD。
# - 产物发 GitHub Pre-release（prerelease=true），不碰 vX.Y.Z 正式 Release。
# - 正式 Release Guard（tools/release/guard.py）保持不变。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "目标完整 commit SHA（40 位）。不得留空；不会默认 main HEAD。"
        required: true
        type: string
      version:
        description: "RC 版本号，例如 0.3.0-rc.1（禁止 vX.Y.Z）"
        required: true
        type: string
      notes:
        description: "简短 RC 变更说明"
        required: false
        default: ""
        type: string
      publish:
        description: "构建完成后是否创建 GitHub Pre-release（false = 只构建产物）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wpg-rc-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  rc-guard:
    name: rc-guard
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      short_sha: ${{ steps.guard.outputs.short_sha }}
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - name: Require explicit SHA
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_SHA// }" ]; then
            echo "[FAIL] 必须提供完整 commit SHA，禁止默认 main HEAD" >&2
            exit 1
          fi
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "[FAIL] SHA 必须是 40 位完整十六进制" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # 直接检出目标 SHA：CI / guard 脚本必须来自该提交（不得用别的分支 HEAD）。
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="$(echo "$INPUT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "[FAIL] checkout HEAD ($ACTUAL) != 目标 SHA ($EXPECTED)" >&2
            exit 1
          fi
          echo "[PASS] checked out $ACTUAL"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Godot 4.6.2
        run: python tools/ci/install_godot.py

      - id: guard
        name: RC Guard
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python tools/release/rc_guard.py --sha "$INPUT_SHA" --version "$INPUT_VERSION"

  build-windows:
    name: build-windows
    needs: rc-guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Godot 4.6.2
        run: python tools/ci/install_godot.py
      - name: Build Windows
        run: python tools/build/export_platform.py windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: rc-windows
          path: artifacts/WPG-v*-windows.zip
          if-no-files-found: error

  build-macos:
    name: build-macos
    needs: rc-guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Godot 4.6.2
        run: python tools/ci/install_godot.py
      - name: Build macOS
        run: python tools/build/export_platform.py macos --release
      - uses: actions/upload-artifact@v7
        with:
          name: rc-macos
          path: artifacts/WPG-v*-macos.zip
          if-no-files-found: error

  build-linux:
    name: build-linux
    needs: rc-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Godot 4.6.2
        run: python tools/ci/install_godot.py
      - name: Build Linux
        run: python tools/build/export_platform.py linux --release
      - uses: actions/upload-artifact@v7
        with:
          name: rc-linux
          path: artifacts/WPG-v*-linux.zip
          if-no-files-found: error

  build-android:
    name: build-android
    needs: rc-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Godot 4.6.2
        run: python tools/ci/install_godot.py
      - name: Build Android APK
        run: python tools/build/export_platform.py android --release
      - uses: actions/upload-artifact@v7
        with:
          name: rc-android
          path: artifacts/WPG-v*-android.apk
          if-no-files-found: error

  build-web:
    name: build-web
    needs: rc-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Godot 4.6.2
        run: python tools/ci/install_godot.py
      - name: Build Web
        run: python tools/build/export_platform.py web --release
      - uses: actions/upload-artifact@v7
        with:
          name: rc-web
          path: artifacts/WPG-v*-web.zip
          if-no-files-found: error

  package:
    name: package
    needs:
      - rc-guard
      - build-windows
      - build-macos
      - build-linux
      - build-android
      - build-web
    runs-on: ubuntu-latest
    outputs:
      artifact_prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: rc-*
          merge-multiple: true
          path: artifacts
      - id: meta
        name: Stage RC artifacts
        env:
          INPUT_VERSION: ${{ needs.rc-guard.outputs.version }}
          INPUT_SHA: ${{ needs.rc-guard.outputs.sha }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python tools/release/rc_stage_artifacts.py \
            --version "$INPUT_VERSION" \
            --sha "$INPUT_SHA" \
            --notes "$INPUT_NOTES" \
            --test-summary "rc-guard + five-platform release export"
          echo "prefix=WPG-${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          ls -la artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.prefix }}-all
          path: |
            artifacts/WPG-${{ needs.rc-guard.outputs.version }}-*
            artifacts/SHA256SUMS.txt
            artifacts/RC_BUILD_INFO.txt
          if-no-files-found: error

  publish:
    name: publish
    needs:
      - rc-guard
      - package
    if: ${{ inputs.publish == true || inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.rc-guard.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.package.outputs.artifact_prefix }}-all
          path: artifacts
      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ needs.rc-guard.outputs.version }}
          INPUT_SHA: ${{ needs.rc-guard.outputs.sha }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python tools/release/rc_publish.py \
            --version "$INPUT_VERSION" \
            --sha "$INPUT_SHA" \
            --notes "$INPUT_NOTES" \
            --test-summary "rc-guard + five-platform release export"
